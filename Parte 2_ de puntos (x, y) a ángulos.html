<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parte 2: de puntos (x, y) a ángulos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f7f5;--fg:#1d1d1b;--card:#fff;--bd:#d6d6d0;--ac:#1a6fd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#ececea;--card:#2a2a27;--bd:#444;--ac:#6aa8f5}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}
p.s{margin:0 0 12px;opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;flex:1 1 340px;min-width:0}
canvas{background:#fff;border:1px solid var(--bd);border-radius:6px;max-width:100%;display:block}
label{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0}
input[type=number]{width:64px}
button,select{border-radius:6px;padding:6px 12px;cursor:pointer;margin:3px 3px 3px 0}
button{background:var(--ac);color:#fff;border:0}
select{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;font-family:monospace;box-sizing:border-box}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px;margin:6px 0;font-size:13px;white-space:pre-wrap;overflow-x:auto}
#info{font-size:13px;margin:4px 0}
.w{color:#d02020}
</style></head><body>
<h1>Parte 2: de puntos (x, y) a ángulos θ1 y θ2</h1>
<p class="s">Pega la lista de la Parte 1, elige las longitudes de los eslabones y mira cómo se mueve el brazo.</p>
<div class="row">
<div class="card">
<b>Datos</b><br>
<textarea id="inp" rows="8">7,5
13,5
13,11
7,11
7,5</textarea>
<label>L1 <input type="number" id="L1" value="10" step="0.5" min="0.1"></label>
<label>L2 <input type="number" id="L2" value="10" step="0.5" min="0.1"></label>
<label>Codo <select id="el"><option value="1">arriba (θ2 +)</option><option value="-1">abajo (θ2 −)</option></select></label><br>
<label>Interpolar en <select id="mode"><option value="xy">coordenadas (x, y)</option><option value="ang">ángulos (θ1, θ2)</option></select></label>
<label>Pasos por tramo <input type="number" id="n" value="10" min="1" max="100"></label>
<label><input type="checkbox" id="cl"> Cerrar figura</label>
<div id="info"></div>
</div>
<div class="card">
<canvas id="cv" width="460" height="460"></canvas>
<button id="pl">▶ Reproducir</button>
<label>Vel. <input type="range" id="sp" min="1" max="60" value="15"></label><br>
<input type="range" id="sl" min="0" max="0" value="0" style="width:100%">
</div>
</div>
<div class="row" style="margin-top:16px">
<div class="card">
<b>Cálculo paso a paso</b> <small id="fi"></small>
<pre id="fm"></pre>
</div>
<div class="card">
<b>Lista de ángulos (grados)</b><br>
<select id="fmt"><option value="csv">CSV: θ1,θ2</option><option value="ino">Arreglo Arduino</option></select>
<button id="cp">Copiar</button><button id="dl">Descargar</button>
<textarea id="out" rows="9" readonly></textarea>
</div>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d'),D=Math.PI/180,TP=2*Math.PI;
let fr=[],cur=0,timer=null,P=[],L1=10,L2=10;
const f2=v=>(+v.toFixed(2)).toString();
function parse(){return $('inp').value.split('\n').map(l=>l.trim().split(/[\s,;]+/).map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1]))}
function ik(x,y,e,prev){
 let c=(x*x+y*y-L1*L1-L2*L2)/(2*L1*L2);const ok=Math.abs(c)<=1;c=Math.max(-1,Math.min(1,c));
 const t2=e*Math.acos(c);let t1=Math.atan2(y,x)-Math.atan2(L2*Math.sin(t2),L1+L2*Math.cos(t2));
 if(prev!=null)t1+=TP*Math.round((prev-t1)/TP);
 return{t1,t2,ok};
}
function mk(t1,t2,ok){return{t1,t2,ok,x:L1*Math.cos(t1)+L2*Math.cos(t1+t2),y:L1*Math.sin(t1)+L2*Math.sin(t1+t2)}}
function build(){
 stop();L1=+$('L1').value||1;L2=+$('L2').value||1;
 const e=+$('el').value,mode=$('mode').value,n=Math.max(1,+$('n').value|0);
 P=parse();if($('cl').checked&&P.length>2)P.push(P[0]);
 fr=[];let bad=0;
 if(P.length){
  let prev=null;const K=P.map(p=>{const r=ik(p[0],p[1],e,prev);prev=r.t1;if(!r.ok)bad++;return r});
  fr.push(mk(K[0].t1,K[0].t2,K[0].ok));
  for(let i=1;i<P.length;i++)for(let s=1;s<=n;s++){
   const t=s/n,a=K[i-1],b=K[i];
   if(mode=='xy'){const r=ik(P[i-1][0]+t*(P[i][0]-P[i-1][0]),P[i-1][1]+t*(P[i][1]-P[i-1][1]),e,fr[fr.length-1].t1);fr.push(mk(r.t1,r.t2,r.ok))}
   else fr.push(mk(a.t1+t*(b.t1-a.t1),a.t2+t*(b.t2-a.t2),a.ok&&b.ok));
  }
 }
 const m=k=>fr.map(r=>r[k]/D),r1=m('t1'),r2=m('t2');
 $('info').innerHTML=!fr.length?'Escribe al menos un punto.':`${P.length} puntos → ${fr.length} posiciones. `+(bad?`<span class="w">⚠ ${bad} punto(s) fuera del alcance (máx. ${f2(L1+L2)}).</span> `:'Todos alcanzables. ')+`<br>θ1 va de ${f2(Math.min(...r1))}° a ${f2(Math.max(...r1))}°; θ2 de ${f2(Math.min(...r2))}° a ${f2(Math.max(...r2))}°.`;
 $('sl').max=Math.max(0,fr.length-1);cur=0;$('sl').value=0;txt();draw();
}
function nice(s){const r=s/6,m=Math.pow(10,Math.floor(Math.log10(r))),n=r/m;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*m}
function draw(){
 const R=Math.max(L1+L2,...P.map(p=>Math.hypot(p[0],p[1])*1.05)),k=205/R,X=x=>230+x*k,Y=y=>230-y*k;
 cx.fillStyle='#fff';cx.fillRect(0,0,460,460);cx.font='11px sans-serif';cx.lineWidth=1;
 const st=nice(2*R);
 for(let v=-Math.floor(R/st)*st;v<=R;v+=st){cx.strokeStyle='#ececE8';cx.beginPath();cx.moveTo(X(v),0);cx.lineTo(X(v),460);cx.moveTo(0,Y(v));cx.lineTo(460,Y(v));cx.stroke();
  if(Math.abs(v)>1e-9){cx.fillStyle='#777';cx.fillText(f2(v),X(v)+2,Y(0)+12);cx.fillText(f2(v),X(0)+3,Y(v)-2)}}
 cx.strokeStyle='#888';cx.beginPath();cx.moveTo(0,Y(0));cx.lineTo(460,Y(0));cx.moveTo(X(0),0);cx.lineTo(X(0),460);cx.stroke();
 cx.setLineDash([5,4]);cx.strokeStyle='#9bb';[L1+L2,Math.abs(L1-L2)].forEach(r=>{cx.beginPath();cx.arc(X(0),Y(0),r*k,0,TP);cx.stroke()});cx.setLineDash([]);
 if(!fr.length)return;
 cx.strokeStyle='#bcd';cx.lineWidth=1.5;cx.beginPath();fr.forEach((r,i)=>i?cx.lineTo(X(r.x),Y(r.y)):cx.moveTo(X(r.x),Y(r.y)));cx.stroke();
 P.forEach((p,i)=>{cx.fillStyle='#1a50c8';cx.beginPath();cx.arc(X(p[0]),Y(p[1]),3.5,0,TP);cx.fill();cx.fillStyle='#235';cx.fillText(i+1,X(p[0])+5,Y(p[1])-5)});
 cx.strokeStyle='#e03030';cx.lineWidth=2;cx.beginPath();for(let i=0;i<=cur;i++)i?cx.lineTo(X(fr[i].x),Y(fr[i].y)):cx.moveTo(X(fr[i].x),Y(fr[i].y));cx.stroke();
 const r=fr[cur],jx=L1*Math.cos(r.t1),jy=L1*Math.sin(r.t1);
 cx.lineCap='round';cx.lineWidth=7;cx.strokeStyle='#444';cx.beginPath();cx.moveTo(X(0),Y(0));cx.lineTo(X(jx),Y(jy));cx.stroke();
 cx.strokeStyle='#e8a400';cx.beginPath();cx.moveTo(X(jx),Y(jy));cx.lineTo(X(r.x),Y(r.y));cx.stroke();cx.lineCap='butt';
 cx.fillStyle='#111';[[0,0],[jx,jy]].forEach(q=>{cx.beginPath();cx.arc(X(q[0]),Y(q[1]),5,0,TP);cx.fill()});
 cx.fillStyle='#e03030';cx.beginPath();cx.arc(X(r.x),Y(r.y),5,0,TP);cx.fill();
}
function formula(){
 if(!fr.length){$('fm').textContent='';$('fi').textContent='';return}
 const r=fr[cur],x=r.x,y=r.y,d=x*x+y*y,c=Math.max(-1,Math.min(1,(d-L1*L1-L2*L2)/(2*L1*L2)));
 const a=Math.atan2(y,x),b=Math.atan2(L2*Math.sin(r.t2),L1+L2*Math.cos(r.t2));
 $('fi').textContent=`(posición ${cur+1} de ${fr.length})`;
 $('fm').textContent=`x = ${f2(x)}, y = ${f2(y)}${r.ok?'':'  ⚠ fuera de alcance'}
cos θ2 = (x² + y² − L1² − L2²) / (2·L1·L2)
       = (${f2(d)} − ${f2(L1*L1)} − ${f2(L2*L2)}) / ${f2(2*L1*L2)} = ${f2(c)}
θ2 = ${$('el').value>0?'+':'−'}arccos(${f2(c)}) = ${f2(r.t2/D)}°
θ1 = atan2(y, x) − atan2(L2·sen θ2, L1 + L2·cos θ2)
   = ${f2(a/D)}° − ${f2(b/D)}° = ${f2((a-b)/D)}°${Math.abs((a-b-r.t1)/D)>0.01?'  → '+f2(r.t1/D)+'° (ajustado por continuidad)':''}`;
}
function txt(){
 const g=r=>f2(r.t1/D)+','+f2(r.t2/D);
 $('out').value=$('fmt').value=='csv'?'theta1,theta2\n'+fr.map(g).join('\n'):`const int N = ${fr.length};\nfloat angulos[N][2] = {\n`+fr.map(r=>'  {'+g(r)+'}').join(',\n')+'\n};';
 formula();
}
function go(i){cur=i;$('sl').value=i;draw();formula()}
function stop(){clearInterval(timer);timer=null;$('pl').textContent='▶ Reproducir'}
function play(){
 if(timer)return stop();if(!fr.length)return;if(cur>=fr.length-1)go(0);
 $('pl').textContent='⏸ Pausar';
 timer=setInterval(()=>{if(cur>=fr.length-1)return stop();go(cur+1)},1000/(+$('sp').value));
}
$('pl').onclick=play;
$('sp').oninput=()=>{if(timer){stop();play()}};
$('sl').oninput=e=>{stop();go(+e.target.value)};
['inp','L1','L2','el','mode','n','cl'].forEach(i=>$(i).oninput=build);
$('fmt').onchange=txt;
$('cp').onclick=()=>{$('out').select();try{navigator.clipboard.writeText($('out').value)}catch(e){document.execCommand('copy')}};
$('dl').onclick=()=>{const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent($('out').value);a.download='angulos_2r.txt';a.click()};
build();
</script></body></html>
